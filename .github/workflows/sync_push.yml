
name: Sync to Remote Repository (Safe with Diff Check)

#コピー元のブランチ名を記入する
on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # checkout（GITHUB_TOKEN無効化）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Git設定
      # ユーザー名とEmailを記載する
      - name: Set Git config
        run: |
          git config --global user.name "kimuikud"
          git config --global user.email "kimuikud@fsi.co.jp"

      # workflow削除（GitHub制限対策）
      - name: Remove workflow files
        run: |
          rm -rf .github/workflows

      # コピー先のリポジトリに接続
      # トークン名とコピー先のurlを記入する
      - name: Add GitHub remote
        run: |
          git remote add RemoteRepository https://x-access-token:${{ secrets.GITBUCKET_TOKEN }}@github.com/kimuikud/GitBucketClone.git

      # ✅ コピー先のリポジトリの最新取得
      - name: Fetch RemoteRepository
        run: |
          git fetch RemoteRepository || echo "No remote yet"

      # ✅ 差分チェック
      - name: Check diff
        id: diffcheck
        run: |
          git diff --quiet RemoteRepository/main HEAD && echo "no_changes=true" >> $GITHUB_OUTPUT || echo "no_changes=false" >> $GITHUB_OUTPUT

      # ✅ 差分ありのときだけ履歴調整
      - name: Rebase with RemoteRepository
        if: steps.diffcheck.outputs.no_changes == 'false'
        run: |
          git pull --rebase RemoteRepository main || echo "No remote branch"

      # ✅ 差分ありのときだけpush
      - name: Push to RemoteRepository
        if: steps.diffcheck.outputs.no_changes == 'false'
        run: |
          git push RemoteRepository main --force

      # ✅ 差分なし
      - name: Skip push (no changes)
        if: steps.diffcheck.outputs.no_changes == 'true'
        run: |
          echo "No differences. Skipping push."
