name: Sync Delete to GitBucket

on:
  delete:

jobs:
  sync-delete:
    runs-on: ubuntu-latest

    steps:
      # checkout（GITHUB_TOKEN無効化）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Git設定
      - name: Set Git config
        run: |
          git config --global user.name "kimuikud"
          git config --global user.email "kimuikud@fsi.co.jp"

      # GitBucket追加
      - name: Add GitBucket
        run: |
          git remote add GitBucket https://x-access-token:${{ secrets.GITBUCKET_TOKEN }}@github.com/kimuikud/GitBucketClone.git

      # 削除処理
      - name: Delete branch on GitBucket
        run: |
          if [[ "${{ github.event.ref_type }}" == "branch" ]]; then
            BRANCH_NAME="${{ github.event.ref }}"

            echo "Deleted branch: $BRANCH_NAME"

            # 対象ブランチ（必要に応じて変更）
            if [[ "$BRANCH_NAME" == Feature* ]] || [[ "$BRANCH_NAME" == Check* ]]; then
              echo "Deleting branch on GitBucket"
              git push GitBucket --delete "$BRANCH_NAME" || echo "Branch not found, skip"
            else
              echo "Branch does not match delete conditions. Skip."
            fi
          else
            echo "Not a branch delete event. Skip."
          fi
